[package]
name = "bbcloud"
version = "0.18.2"
edition = "2021"
rust-version = "1.88"
description = "Bitbucket Cloud CLI — open pull requests, read every comment, write replies, from the shell"
authors = ["Seán Baufeld"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/biokraft/bbcloud"
homepage = "https://github.com/biokraft/bbcloud"
documentation = "https://github.com/biokraft/bbcloud#readme"
keywords = ["bitbucket", "cli", "pull-request", "git", "devtools"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["docs/", ".github/", ".superpowers/", ".worktrees/"]

[lib]
name = "bb_cli"
path = "src/lib.rs"

[[bin]]
name = "bb"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native", "sync-secret-service", "vendored"] }
secrecy = "0.10"
comfy-table = "7"
owo-colors = { version = "4", features = ["supports-colors"] }
indicatif = "0.17"
inquire = { version = "0.7", features = ["editor"] }
open = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
urlencoding = "2"
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
futures = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
wiremock = "0.6"
assert_cmd = "2"
predicates = "3"
tempfile = "3"
serial_test = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
