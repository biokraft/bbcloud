name: Pages

on:
  push:
    branches: [main]
    paths:
      - slides/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deployments must not be cancelled halfway: a cancelled run leaves the previous
# artifact live, which is the state we want, so a newer one finishes instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy slides to github pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The deck is already static — no build step, and every reference inside it
      # is relative, so it serves correctly from the site root.
      - name: Upload the deck
        uses: actions/upload-pages-artifact@v3
        with:
          path: slides
      - id: deployment
        uses: actions/deploy-pages@v4
